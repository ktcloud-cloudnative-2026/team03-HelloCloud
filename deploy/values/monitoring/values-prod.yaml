# local-path는 크기를 나중에 못 늘린다. 보관 기간과 용량을 함께 묶어 디스크가 꽉 차지 않게 한다(dev와 같음).
prometheus:
  prometheusSpec:
    # prod DB VM(t4-prod-db)은 클러스터 밖이라 exporter 주소를 직접 적는다(cluster/README.md "DB VM (prod exporter)")
    additionalScrapeConfigs:
      - job_name: db-vm-node
        static_configs:
          - targets: ["10.10.24.20:9100"]
            labels:
              vm: t4-prod-db
      - job_name: db-vm-mysql
        static_configs:
          - targets: ["10.10.24.20:9104"]
            labels:
              vm: t4-prod-db
      - job_name: db-vm-mongodb
        static_configs:
          - targets: ["10.10.24.20:9216"]
            labels:
              vm: t4-prod-db
      - job_name: db-vm-redis
        static_configs:
          - targets: ["10.10.24.20:9121"]
            labels:
              vm: t4-prod-db
    retention: 3d
    retentionSize: 4GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  # 로그 검색(Explore)용. Loki는 logging namespace에 있다(argocd/platform/loki-prod.yaml)
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
