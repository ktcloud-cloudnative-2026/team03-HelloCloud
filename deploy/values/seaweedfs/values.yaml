image:
  tag: '4.53'
master:
  replicas: 1
  volumeSizeLimitMB: 1000
  data:
    type: persistentVolumeClaim
    size: 1Gi
    storageClass: local-path
  logs:
    type: emptyDir
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
volume:
  replicas: 1
  dataDirs:
    - name: data
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: local-path
      maxVolumes: 8
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi
    storageClass: local-path
  logs:
    type: emptyDir
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
s3:
  enabled: true
  replicas: 1
  enableAuth: true
  existingConfigSecret: seaweedfs-s3-auth
  logs:
    type: emptyDir
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
