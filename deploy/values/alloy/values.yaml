# 로그 수거원. 쿠버네티스 API로 파드 로그를 읽어 Loki에 보낸다(loki.source.kubernetes).
# 노드 디스크를 직접 읽지 않아 노드마다 띄울 필요가 없다. 대신 로그가 API 서버를 거친다
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 32Mi
