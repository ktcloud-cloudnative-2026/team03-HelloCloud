replicaCount: 1
image:
  tag: "ef82da4"
autoscaling:
  enabled: true
# 부하 테스트 2차(#204): 파드당 실제로 약 1코어를 써서, requests 100m로는 스케줄러가
# 새 파드를 한 노드에 몰았다(2차-1). 실사용에 맞추고 노드에 나눠 띄운다
resources:
  requests:
    cpu: 1000m
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    # Istio 전후 비교(#146)를 2차-2와 같은 배치로 맞추려고 강제한다. 자리가 없으면 Pending
    whenUnsatisfiable: DoNotSchedule
    # 파드를 못 두는 cp(taint)는 세지 않는다. 세면 cp가 0개로 잡혀 워커 2대에 3개를 못 둔다
    nodeTaintsPolicy: Honor
# 나눠 띄우기는 user끼리만 센다. 2+1로 나뉠 때 user 2개가 file 노드에 겹치면 그 노드 CPU가 찬다(Istio 후 측정, #146)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: file-service

istioSidecarInjection: true

istioInternalMembershipPolicy: true
