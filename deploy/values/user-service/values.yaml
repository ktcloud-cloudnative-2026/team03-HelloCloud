containerPort: 8081

image:
  repository: ghcr.io/ktcloud-cloudnative-2026/idcn-user-service

env:
  # 메모리 상한이 있으면 Java는 기본으로 상한의 1/4만 heap으로 써서 금방 메모리가 모자란다
  - name: JAVA_TOOL_OPTIONS
    value: -XX:MaxRAMPercentage=65
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: DB_URL
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: DB_USERNAME
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: DB_PASSWORD
  - name: OIDC_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: OIDC_ISSUER_URI
  # 키가 없어도 파드는 뜨고, 초대 링크가 http://localhost:5173로 만들어집니다.
  - name: INVITE_BASE_URL
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: INVITE_BASE_URL
        optional: true
  # 멤버 제거를 chat에 알리는 Redis(MEMBER_REMOVED). 키가 없어도 파드는 뜨고 알림만 빠집니다.
  # 그때 chat의 열린 연결은 로그인 토큰이 만료될 때 끊깁니다.
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: REDIS_URL
        optional: true
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: user-service-env
        key: REDIS_PASSWORD
        optional: true

# HPA는 requests 대비 CPU 사용률로 판단한다. CPU 상한은 두지 않는다(시작할 때 CPU를 많이 써서 느려짐)
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
