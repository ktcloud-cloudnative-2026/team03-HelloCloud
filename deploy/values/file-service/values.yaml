containerPort: 8082

image:
  repository: ghcr.io/ktcloud-cloudnative-2026/idcn-file-service

env:
  # 메모리 상한이 있으면 Java는 기본으로 상한의 1/4만 heap으로 써서 금방 메모리가 모자란다
  - name: JAVA_TOOL_OPTIONS
    value: -XX:MaxRAMPercentage=70
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_URL
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_USERNAME
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_PASSWORD
  - name: OIDC_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: OIDC_ISSUER_URI
  - name: USER_SERVICE_URL
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: USER_SERVICE_URL
  - name: S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_ENDPOINT
  - name: S3_PUBLIC_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_PUBLIC_ENDPOINT
  - name: S3_REGION
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_REGION
  - name: S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_BUCKET
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_SECRET_KEY

# HPA는 requests 대비 CPU 사용률로 판단한다. CPU 상한은 두지 않는다(시작할 때 CPU를 많이 써서 느려짐)
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
