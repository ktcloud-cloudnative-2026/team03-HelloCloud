containerPort: 8082

image:
  repository: ghcr.io/ktcloud-cloudnative-2026/idcn-file-service

env:
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_URL
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_USERNAME
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: DB_PASSWORD
  - name: OIDC_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: OIDC_ISSUER_URI
  - name: USER_SERVICE_URL
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: USER_SERVICE_URL
  - name: S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_ENDPOINT
  - name: S3_PUBLIC_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_PUBLIC_ENDPOINT
  - name: S3_REGION
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_REGION
  - name: S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_BUCKET
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: file-service-env
        key: S3_SECRET_KEY
