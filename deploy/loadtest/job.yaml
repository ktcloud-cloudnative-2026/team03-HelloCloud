apiVersion: batch/v1
kind: Job
metadata:
  name: k6-read-apis
  namespace: loadtest
spec:
  # 실패해도 다시 돌지 않는다. 다시 돌면 부하가 두 번 걸려 결과가 섞인다
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
    spec:
      restartPolicy: Never
      # 전후 비교가 같은 조건이 되도록 w2에 고정한다(#146). cp는 apiserver · etcd가 느려져 피한다.
      # 서비스 파드 피하기(podAntiAffinity)는 쓰지 않는다. 스케줄러가 거꾸로도 적용해 서비스 파드가 k6 노드를 피하면서 배치가 흔들렸다(11/24)
      nodeSelector:
        kubernetes.io/hostname: t4-dev-w2
      containers:
        - name: k6
          image: grafana/k6:2.4.0
          args:
            - run
            - /scripts/read-apis.js
          envFrom:
            - configMapRef:
                name: k6-run
          # 테스트 계정 Secret은 Keycloak 담당이 손으로 만든다(Git에 비밀번호를 두지 않음)
          env:
            - name: K6_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-loadtest-credentials
                  key: username
            - name: K6_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-loadtest-credentials
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            # 200명(초당 약 600요청)이면 1코어에서 k6 자체가 먼저 지칠 수 있다(#146). 실행 중 k6 CPU를 같이 본다
            limits:
              cpu: "2"
              # 가상 사용자 하나에 1~5MB라 200명이면 512Mi에 닿을 수 있다. 넘으면 다시 돌지 않고 요약도 안 남는다
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-script
