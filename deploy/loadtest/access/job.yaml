apiVersion: batch/v1
kind: Job
metadata:
  name: k6-access-check
  namespace: loadtest
spec:
  # 다시 돌면 멤버 제거가 한 번 더 일어나 회차가 섞인다
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-access
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.4.0
          args:
            - run
            - /scripts/access-check.js
          envFrom:
            - configMapRef:
                name: k6-access-run
          # 계정 셋: 조직 7 OWNER, 조직 7 MEMBER(제거 대상), 다른 조직 OWNER. Secret은 Keycloak 담당이 손으로 만든다
          env:
            - name: OWNER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-loadtest-credentials
                  key: username
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-loadtest-credentials
                  key: password
            - name: MEMBER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-access-member-credentials
                  key: username
            - name: MEMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-access-member-credentials
                  key: password
            - name: OTHER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-access-owner-credentials
                  key: username
            - name: OTHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-access-owner-credentials
                  key: password
          # 가상 사용자 1명이라 작게 둔다
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-access-script
