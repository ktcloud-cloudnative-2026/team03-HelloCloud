replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080

# 컨테이너를 root로 띄우지 않는다. 이미지가 root면 파드가 시작되지 않는다
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  port: 80

env: []
envFrom: []

startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

resources: {}
