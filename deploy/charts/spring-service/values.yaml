replicaCount: 1

# 켜면 CPU 사용률(requests 대비)에 따라 파드 수를 minReplicas~maxReplicas 사이에서 바꾼다.
# 켤 때는 resources.requests.cpu가 있어야 한다
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # 비워 두면 쿠버네티스 기본 동작을 따른다. 서비스 values에서 scaleUp · scaleDown 규칙을 넣을 수 있다
  behavior: {}

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080

service:
  port: 80

env: []
envFrom: []

startupProbe:
  httpGet:
    path: /health/liveness
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http

readinessProbe:
  httpGet:
    path: /health/readiness
    port: http

resources: {}

# 비워 두면 쓰지 않는다. 항목마다 maxSkew · topologyKey · whenUnsatisfiable을 적고,
# labelSelector는 차트가 이 서비스 파드로 채운다
topologySpreadConstraints: []

# 파드를 둘 노드를 고르는 규칙(그대로 Deployment에 넣음). 기본은 비움
affinity: {}

# 워크로드 단위로 사이드카를 적용한다.
istioSidecarInjection: false

serviceAccount:
  create: false

istioInternalMembershipPolicy: false
