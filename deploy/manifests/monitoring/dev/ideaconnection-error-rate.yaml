apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ideaconnection-error-rate
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: ideaconnection.http
      rules:
        - alert: IdeaConnectionHighErrorRate
          expr: |
            (
              sum by (namespace, job) (
                rate(http_server_requests_seconds_count{
                  namespace="ideaconnection-dev",
                  status=~"5..",
                  uri!~"/health/.*|/metrics"
                }[5m])
              )
              /
              sum by (namespace, job) (
                rate(http_server_requests_seconds_count{
                  namespace="ideaconnection-dev",
                  uri!~"/health/.*|/metrics"
                }[5m])
              )
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "IdeaConnection {{ $labels.job }} HTTP 5xx 에러율 5% 초과"
            description: "{{ $labels.job }} 서비스의 최근 5분간 HTTP 5xx 에러율이 5%를 초과한 상태가 5분 동안 지속되었습니다."
