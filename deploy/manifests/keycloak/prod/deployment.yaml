apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ideaconnection-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      annotations:
        checksum/login-theme: "0923bb2659cbae545059c58a4ce7280bd953f9c4efc84f814adb9687817336a4"
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL
              value: jdbc:mysql://10.10.24.20:3306/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-env
                  key: KC_DB_PASSWORD
            - name: KC_HOSTNAME
              value: https://ideaconnection.jpexstudio.com
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: login-theme
              mountPath: /opt/keycloak/themes/ideaconnection
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: login-theme
          configMap:
            name: keycloak-login-theme
            items:
              - key: theme.properties
                path: login/theme.properties
              - key: ideaconnection.css
                path: login/resources/css/ideaconnection.css
              - key: logo.svg
                path: login/resources/img/logo.svg
        - name: realm
          configMap:
            name: keycloak-realm
