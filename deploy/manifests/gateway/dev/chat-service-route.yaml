apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-service-route
  namespace: ideaconnection-dev
spec:
  parentRefs:
    - name: hellocloud-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/chat
      backendRefs:
        - name: chat-service
          port: 80
