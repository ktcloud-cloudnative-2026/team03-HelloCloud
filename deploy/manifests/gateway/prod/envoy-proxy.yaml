apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: prod-proxy-config
  namespace: ideaconnection-prod
  annotations:
    # GatewayClass가 참조하기 전에 설정을 먼저 준비합니다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          metallb.io/loadBalancerIPs: "10.10.24.200"
