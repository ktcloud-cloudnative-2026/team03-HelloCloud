apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: ideaconnection-prod
spec:
  parentRefs:
    - name: hellocloud-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/hellocloud
        - path:
            type: PathPrefix
            value: /resources
      filters:
        # 외부 HTTPS는 Cloudflare에서 종료합니다. 내부 HTTP가 발급자 주소로 쓰이지 않게 합니다.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: keycloak
          port: 8080
