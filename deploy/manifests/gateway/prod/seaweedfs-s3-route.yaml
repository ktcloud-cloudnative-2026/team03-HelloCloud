apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs-s3-route
  namespace: ideaconnection-prod
spec:
  parentRefs:
    - name: hellocloud-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat-attachments
      backendRefs:
        - name: seaweedfs-s3
          namespace: seaweedfs
          port: 8333
