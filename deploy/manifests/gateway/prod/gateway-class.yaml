apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
