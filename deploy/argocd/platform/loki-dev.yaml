apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 21.4.1
      helm:
        releaseName: loki
        valueFiles:
          - $values/deploy/values/loki/values.yaml
          - $values/deploy/values/loki/values-dev.yaml
    - repoURL: https://github.com/ktcloud-cloudnative-2026/team03-HelloCloud.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
