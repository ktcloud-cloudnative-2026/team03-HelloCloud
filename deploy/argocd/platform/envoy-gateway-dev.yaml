apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.3
      helm:
        releaseName: eg
        valueFiles:
          - $values/deploy/values/envoy-gateway/values.yaml
          - $values/deploy/values/envoy-gateway/values-dev.yaml
    - repoURL: https://github.com/ktcloud-cloudnative-2026/team03-HelloCloud.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ClientSideApplyMigration=false
      - FailOnSharedResource=true
