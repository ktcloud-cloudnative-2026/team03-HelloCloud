apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/deploy/values/alloy/values.yaml
          - $values/deploy/values/alloy/values-prod.yaml
    - repoURL: https://github.com/ktcloud-cloudnative-2026/team03-HelloCloud.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
