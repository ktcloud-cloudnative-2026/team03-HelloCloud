apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.14.0
      helm:
        releaseName: metrics-server
        valueFiles:
          - $values/deploy/values/metrics-server/values.yaml
    - repoURL: https://github.com/ktcloud-cloudnative-2026/team03-HelloCloud.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
