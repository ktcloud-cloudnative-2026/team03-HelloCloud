name: idcn-ci

services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: idcn-jenkins-controller:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_casc/jenkins.yaml:ro
    depends_on:
      - agent

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        DOCKER_GID: ${DOCKER_GID}
    image: idcn-jenkins-agent:local
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBLIC_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # VM의 Docker로 빌드 · push
      - trivy_cache:/home/jenkins/.trivy             # 취약점 DB를 매번 받지 않게 보관

volumes:
  jenkins_home:
  trivy_cache:
