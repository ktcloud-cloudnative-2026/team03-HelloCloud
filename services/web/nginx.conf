server {
  listen 80;
  root /usr/share/nginx/html;

  # /invite/<토큰>처럼 파일이 없는 주소도 index.html을 돌려줘야 웹이 화면을 고른다.
  # index.html은 매번 새 버전이 있는지 묻게 한다. 그러지 않으면 배포 뒤에도 브라우저가
  # 예전 index.html과 그 안의 예전 JS 이름을 계속 써서 예전 화면이 보인다(#183).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # 빌드 파일이 없으면 HTML 대신 404를 돌려줘야 브라우저가 엉뚱한 파일을 JS로 읽지 않는다.
  # 이름에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀌므로 오래 캐시해도 된다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
