server:
  port: 8082
spring:
  application:
    name: file-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
logging:
  structured:
    format:
      console: com.ideaconnection.common.logging.JsonLogFormatter
management:
  endpoints:
    web:
      base-path: /
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
file:
  user-service-url: ${USER_SERVICE_URL:http://user-service}
  s3:
    endpoint: ${S3_ENDPOINT}
    public-endpoint: ${S3_PUBLIC_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:chat-attachments}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
