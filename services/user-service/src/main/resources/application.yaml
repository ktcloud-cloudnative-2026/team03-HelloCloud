server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      # Redis가 멈췄을 때 멤버 제거 요청이 오래 기다리지 않게 한다(기본 60초)
      timeout: 1s
      connect-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
invite:
  # 초대 링크 앞부분. 웹 화면 주소를 넣는다.
  base-url: ${INVITE_BASE_URL:http://localhost:5173}
logging:
  structured:
    format:
      console: com.ideaconnection.common.logging.JsonLogFormatter
management:
  endpoints:
    web:
      base-path: /
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # p95 응답 시간을 계산하려면 응답 시간을 구간별로 세어 둬야 한다
      percentiles-histogram:
        "[http.server.requests]": true
