# IDCN CI: 수업 실습(cicd-lab)의 흐름을 팀 저장소(모노레포)에 맞춘 버전
# 시작 조건 → deploy 검사 → 테스트 → 빌드 → 스캔 → (main만) 올리기 → 매니페스트 갱신
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 기본은 읽기만. 쓰기 권한은 main의 release 작업에만 준다 (최소 권한)
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 앞 검사는 취소. main은 순서대로 하나씩
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/ktcloud-cloudnative-2026
  # Spring 서비스는 공통 코드(libs, gradle) 때문에 services/ 전체를 빌드 재료로 쓰고,
  # 나머지(web, chat-service 등)는 자기 폴더만 쓴다
  SPRING_SERVICES: user-service file-service
  # 도구 버전 고정 (latest 금지)
  YAMLLINT_VERSION: 1.37.1
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.7.0
  # trivy는 2026년 3월 공급망 사고로 0.69.4가 오염됐다. 안전 확인된 0.69.3을 체크섬과 함께 고정
  TRIVY_VERSION: 0.69.3
  TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
  YQ_VERSION: v4.44.3

jobs:
  # PR과 main 모두: 바뀐 것 찾기 → deploy 검사 → 테스트 (PR은 빌드 · 스캔까지)
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0           # 비교할 이전 커밋이 필요하다
          persist-credentials: false

      - name: 시작 조건
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(git diff --name-only "$BEFORE" HEAD)   # push에 커밋이 여러 개여도 모두 본다
          else
            files=$(git diff --name-only HEAD~1 HEAD)
          fi

          # services/user-service/src/... → user-service
          dirs=$(echo "$files" | awk -F/ '$1 == "services" && NF > 2 { print $2 }' | sort -u)
          # 공통 라이브러리(libs)나 Gradle 공통 설정을 바꾸면 Spring 서비스(user, file)를 모두 다시 검사.
          # services/ 바로 아래 파일(build.gradle 등)은 위 awk에 잡히지 않아 따로 본다
          if echo "$files" | grep -qE '^services/(libs/|gradle/|config/|build\.gradle$|settings\.gradle$|gradlew$|\.dockerignore$)'; then
            dirs=$(printf '%s\n' $dirs $SPRING_SERVICES | sort -u)
          fi
          # Dockerfile이 있는 서비스 폴더와 web만 남긴다
          services=""
          for d in $dirs; do
            case "$d" in *-service|web) [ -f "services/$d/Dockerfile" ] && services="$services $d" ;; esac
          done
          services=$(echo $services)
          deploy=false
          echo "$files" | grep -q '^deploy/' && deploy=true

          echo "바뀐 서비스: ${services:-없음} / deploy 변경: $deploy"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: deploy 검사 도구 설치
        if: steps.changes.outputs.deploy == 'true'
        run: |
          pip install --quiet "yamllint==${YAMLLINT_VERSION}"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform

      - name: deploy 검사
        if: steps.changes.outputs.deploy == 'true'
        run: bash deploy/scripts/validate.sh

      - name: 테스트
        if: steps.changes.outputs.services != ''
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
        run: |
          # 언어와 상관없이 각 서비스 Dockerfile의 test 단계까지만 빌드 (테스트가 실패하면 여기서 멈춤)
          ctx() { case " $SPRING_SERVICES " in *" $1 "*) echo services ;; *) echo "services/$1" ;; esac; }
          for svc in $SERVICES; do
            docker build --target test -f "services/$svc/Dockerfile" "$(ctx "$svc")"
          done

      # 아래 빌드 · 스캔은 PR에서만. main에서는 release 작업이 같은 일을 하고 이어서 올린다
      - name: 빌드
        if: github.event_name == 'pull_request' && steps.changes.outputs.services != ''
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          TAG: ${{ github.event.pull_request.head.sha }}
        run: |
          ctx() { case " $SPRING_SERVICES " in *" $1 "*) echo services ;; *) echo "services/$1" ;; esac; }
          for svc in $SERVICES; do
            docker build -f "services/$svc/Dockerfile" -t "$REGISTRY/idcn-$svc:${TAG::7}" "$(ctx "$svc")"
          done

      - name: 스캔 도구 설치
        if: github.event_name == 'pull_request' && steps.changes.outputs.services != ''
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: 스캔
        if: github.event_name == 'pull_request' && steps.changes.outputs.services != ''
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          TAG: ${{ github.event.pull_request.head.sha }}
        run: |
          for svc in $SERVICES; do
            trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$REGISTRY/idcn-$svc:${TAG::7}"
          done

  # main에 머지된 뒤에만: 빌드 → 스캔 → 올리기 → 매니페스트 갱신
  release:
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.services != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # GHCR에 이미지 올리기 (GITHUB_TOKEN으로 충분)
    env:
      SERVICES: ${{ needs.check.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 태그 정하기
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"   # 이미지 태그 = 커밋 7자리 (팀 규칙)

      - name: 빌드
        run: |
          ctx() { case " $SPRING_SERVICES " in *" $1 "*) echo services ;; *) echo "services/$1" ;; esac; }
          for svc in $SERVICES; do
            docker build -f "services/$svc/Dockerfile" -t "$REGISTRY/idcn-$svc:$TAG" "$(ctx "$svc")"
          done

      - name: 스캔
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          for svc in $SERVICES; do
            trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$REGISTRY/idcn-$svc:$TAG"
          done

      - name: 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in $SERVICES; do
            docker push "$REGISTRY/idcn-$svc:$TAG"
          done
          docker logout ghcr.io

      - name: 매니페스트 갱신
        # main 보호 규칙 때문에 GITHUB_TOKEN으로는 main에 push할 수 없다.
        # main 보호 규칙에서 bypass를 받은 계정의 개인 토큰(저장소 Secret CI_PUSH_TOKEN)으로 push한다
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo install /tmp/yq /usr/local/bin/yq
          # checkout이 토큰을 남기지 않게 했으므로(persist-credentials: false) 최신 main은 읽기 토큰으로 받는다
          git fetch --no-tags "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          for svc in $SERVICES; do
            f="deploy/values/${svc}/values-dev.yaml"
            if [ -f "$f" ]; then
              yq -i '.image.tag = strenv(TAG)' "$f"
            else
              echo "values 파일 없음: $f (건너뜀)"
            fi
          done
          if git diff --quiet; then
            echo "바꿀 values 파일이 없어 push하지 않습니다"
            exit 0
          fi
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secret CI_PUSH_TOKEN이 없어 main에 push할 수 없습니다"
            exit 1
          fi
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          git -c user.name="idcn-ci" -c user.email="ci@idcn.local" commit -am "ci: dev 이미지 ${TAG} 반영 [skip ci]"
          git pull --rebase "$url" main
          git push "$url" main
